# G5-02 (Bloque 0 de docs/BRECHAS_V2.md, 2026-10-12): las pruebas corren SOLAS antes de
# desplegar. Railway despliega con cada push a main; con "Wait for CI" activado en
# Railway (Settings → Deploy → "Wait for CI") espera a que este trabajo termine en
# verde y NO publica un commit con pruebas rojas.
#
# Mismo entorno que la PC de Fabrizio y que la imagen: Python 3.11 con las versiones
# EXACTAS de constraints.txt, Node (las pruebas de engine/*.js lo usan) y Postgres 16
# con DATABASE_URL=…/khipus_test (sin ella ~300 pruebas de ontología se saltan).
# Las pruebas con navegador (Playwright/Chromium) se SALTAN solas aquí: no se instala
# Playwright (pytest.importorskip) — ver tests/test_block0_ci.py.
# INFRA_OPERATIVA paso 10: además se instala requirements-dev.txt (pySHACL + rdflib, oráculo de las puertas).
# No toca el humo del MCP (smoke-mcp.yml), que sigue corriendo DESPUÉS del deploy.
name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main, 'claude/**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: khipus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d khipus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:devpass@localhost:5432/khipus_test
      KHIPU_SCHEDULER: 'off'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dependencias (versiones exactas, igual que el Dockerfile)
        run: pip install -r requirements.txt -c constraints.txt
      # INFRA_OPERATIVA paso 10: pySHACL + rdflib = ORÁCULO de las puertas (solo CI; la imagen no los lleva).
      # Con CI=true, tests/test_gates_conformance.py FALLA si no están (no se salta en silencio).
      - name: Dependencias de pruebas (oráculo SHACL)
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Formas y gobernanza al día (TTL → IR compilado, artefactos == manifest)
        run: |
          python scripts/build_shapes.py --check
          python scripts/build_governance.py --check
      - name: Pruebas
        run: pytest tests/ -q
